<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Shield Outline -->
  <path d="M64 26 L94 38 C94 68 64 96 64 96 C64 96 34 68 34 38 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Circular Badge with Number Concept -->
  <circle cx="64" cy="58" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Center check or focus dot -->
  <path d="M57 58 L62 63 L72 53" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
